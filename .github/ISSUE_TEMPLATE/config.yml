# Issues are for things that are broken. Everything else has a place in
# Discussions, and the chooser says where.
#
# The bug form asks for the diagnostic report, and the report is the difference
# between a bug that can be reproduced and one that reads "it didn't work" --
# which is what a blank issue tends to become on a device with no keyboard and a
# log nobody can reach. The plugin can produce that report in two taps, so the
# form asks for something it costs almost nothing to give.
#
# Requests went to Ideas rather than staying an issue form. Most are never built,
# and an issue is expected to end closed, so they either sat open for good or
# were closed on somebody. What decides one is a conversation, and an idea that
# is going to be built becomes an issue from the discussion.
blank_issues_enabled: false
contact_links:
  - name: Ask a question
    url: https://github.com/elpendor/deckyemu/discussions/categories/q-a
    about: Setting something up, or not sure whether it is a bug.
  - name: Ask for something
    url: https://github.com/elpendor/deckyemu/discussions/categories/ideas
    about: A feature, a change to one that exists, or an emulator the plugin does not cover.
