name: Docs

# Only when the docs themselves change. A release commit or a backend fix has
# nothing to republish, and a build per push would queue against `concurrency`
# for no reason.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "mkdocs.yml"
      - "scripts/readme_as_index.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]

# Read to check out, write to publish. `id-token` is what the deploy action
# exchanges for its upload credential.
permissions:
  contents: read
  pages: write
  id-token: write

# One live site, so a second run waits rather than racing the first. Not
# cancel-in-progress: a half-finished deploy is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned. An unpinned theme turns a docs build into something that can
      # break without anybody touching the repository.
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.5.44

      # The site's front page is the README, with its links moved down one
      # directory. Generated rather than committed so there is one of it.
      - run: python scripts/readme_as_index.py

      # `--strict` fails on a broken internal link or a page missing from the
      # nav, which is the class of rot the hand-written Contents lists had.
      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # A pull request builds to prove the docs still compile and stops there;
  # anything on `main` publishes.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
