name: CI

# The same commands the deploy loop runs by hand: both test suites, typecheck,
# bundle, plus an installable plugin to download.
#
# Dispatched by hand, and run on every pull request. Still not on push: commits
# that land directly are validated before they leave the machine, a build per
# push is noise rather than a signal, and the release commit this workflow makes
# cannot retrigger it.
#
# A pull request is the case none of that covers -- a branch from somebody else
# has never been near that machine, and with no trigger the only way to learn
# whether it builds is to fetch it and run the checks by hand. It is also what
# "do not merge unless the checks pass" would be built on: a required status
# check has to be one that actually runs.
#
# The publishing half is inert here without any guard of its own. Every step
# from the version bump down is `if: inputs.publish`, and a pull request has no
# inputs, so they all skip. Nothing about a release can happen on this path.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release"
        type: boolean
        default: false
      bump:
        description: "Version to release (ignored unless publishing)"
        type: choice
        default: patch
        options: [patch, minor, major, none]
      summary:
        description: "What matters in this release, in a sentence or two. Markdown; goes above the generated notes."
        type: string
        default: ""
        required: false
  pull_request:
    branches: [main]

# One run per pull request. Pushing three fixes in a minute should leave one
# answer, not three, and the two it cancels were about to be superseded anyway.
# Keyed so a dispatched run is never cancelled by a pull request or the reverse.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Committing the version bump and creating a release both need write access;
    # the rest of the job does not.
    #
    # This cannot be narrowed per event: `permissions` takes no expressions --
    # it is absent from the context-availability table, unlike `concurrency`
    # above, which is why the trick that looks obvious here does not parse. What
    # keeps a pull request away from the write half is that every step from the
    # bump down is `if: inputs.publish`, and a pull request has no inputs. A
    # branch from a fork is narrower still: GitHub issues those a read-only
    # token whatever this file asks for.
    #
    # Splitting the checks into their own job with `contents: read` and leaving
    # the release half `needs:` it would make that structural rather than
    # argued. Worth doing if this path ever grows a step that writes.
    permissions:
      contents: write
    steps:
      # On a dispatch, the branch rather than the detached commit: a release
      # commits the bump back to it. On a pull request `github.ref_name` is
      # `<n>/merge`, which is not a branch and cannot be checked out -- and
      # `github.sha` on that event is already the merge commit GitHub prepared,
      # which is the thing under review.
      #
      # Written with `github.sha` rather than an empty string meaning "take the
      # default", because `a && '' || b` does not do that: an empty string is
      # falsy, so the `&&` fails and it yields `b`. That is how this shipped
      # broken the first time -- it asked for `1/merge` and stopped there. Both
      # arms of this idiom have to be truthy or it silently picks the wrong one.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref_name }}
          # The release notes are generated from the commits since the previous
          # tag, and the default shallow clone has neither the tags nor the
          # history to walk. It would only fail on the run that matters.
          fetch-depth: 0

      # Before setup-node, which needs pnpm on PATH to resolve its cache.
      # `version` rather than a packageManager field, since package.json has none.
      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pnpm install --frozen-lockfile

      # Everything that does not depend on the version runs first, so a release
      # never pushes a bump that then fails to build.

      # The frontend suite. Fast and pure -- no DOM, no Deck -- and it covers
      # the rules that decide whether something gets deleted, which nothing on
      # the Python side can reach.
      - name: Frontend tests
        run: pnpm exec vitest run

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # The backend half. Not strict -- see mypy.ini for what is off and why --
      # but it is what found prepare_shortcut indexing an install that the
      # guard above it allows to be None.
      - name: Typecheck the backend
        run: |
          pip install mypy
          python -m mypy py_modules main.py

      # Offline: the live section reaches thumbnails.libretro.com and
      # steamgriddb.com, which would make CI fail on their availability rather
      # than on this repository's changes.
      - name: Backend tests
        run: python scripts/test_backend.py --offline

      # The backend runs on decky's bundled Python, so a syntax error in a module
      # that the suite happens not to import would only surface on the device.
      - name: Compile every backend module
        run: python -m compileall -q main.py py_modules

      # Both directions of the development-only guarantee: absent from a release
      # build, and *still present* in a development one. The second half is what
      # stops the check passing because the panel was renamed or deleted, and CI
      # did not have it -- the grep further down tests one direction only, so a
      # rename would have gone green while the guarantee it stands for was no
      # longer being tested at all.
      #
      # Here rather than beside that grep because it builds its own bundles and
      # leaves dist/ holding the development one; the release bundle that ships
      # is built after the version bump, below.
      - name: Check the development-only guard still discriminates
        run: python scripts/check_release_build.py

      # --- version ------------------------------------------------------------
      #
      # package.json is the single source of truth. Bumping happens here rather
      # than by hand so a release is one action, and it is committed *before* the
      # bundle is built: the commit stamped into a build has to be one whose
      # package.json carries the version being released, or the two halves of that
      # metadata contradict each other.

      - name: Bump the version
        if: inputs.publish && inputs.bump != 'none'
        run: npm version "${{ inputs.bump }}" --no-git-tag-version

      - name: Read the version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Refuse to reuse a version
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.meta.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$tag already exists. Pick a bump, or use bump=none only for a version never released."
            exit 1
          fi

      - name: Commit the bump
        if: inputs.publish && inputs.bump != 'none'
        run: |
          git config user.name "Pendor"
          git config user.email "2113610+elpendor@users.noreply.github.com"
          git add package.json
          git commit -m "Release v${{ steps.meta.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"

      # What the release is actually made from: the bump commit when there is one,
      # otherwise whatever was checked out.
      - name: Resolve the build commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Generated from the commit subjects since the previous tag, so there is no
      # changelog file to keep in step with the code. Written to a file rather
      # than a step output because it is multi-line, and read by both the release
      # body and the build stamp that ships inside the zip -- the plugin shows the
      # running version's notes offline, without a network or a token.
      #
      # Resolved *after* the bump commit exists, so the range ends at what is
      # actually being released.
      # The summary is typed at dispatch rather than kept anywhere, and lands
      # above the generated sections -- which are unchanged by it.
      #
      # Prepended to the *file* rather than pasted onto the release afterwards,
      # because this file feeds two things: the release body and the build stamp
      # inside the zip. Editing the release later would show the summary on
      # GitHub and not in the plugin's own Updates tab, which reads the stamp
      # offline.
      #
      # Why a person writes it: `changelog.py` groups by prefix and deliberately
      # does not rank, and the note there records why -- importance was measured
      # to be underivable from the diff, in both directions. What is worth
      # telling somebody is known when the commit is written and nowhere else.
      - name: Generate the changelog
        env:
          SUMMARY: ${{ inputs.summary }}
        run: |
          python scripts/changelog.py > generated-notes.md
          # Plain shell, and read from the environment rather than interpolated:
          # the summary is arbitrary markdown somebody typed, so an apostrophe or
          # a backtick in it must not be able to reach the shell as syntax.
          # `printf '%s'` also leaves it exactly as written, newlines included.
          {
            if [ -n "$SUMMARY" ]; then
              printf '%s\n\n' "$SUMMARY"
            fi
            cat generated-notes.md
          } > release-notes.md
          echo "--- notes for v${{ steps.meta.outputs.version }} ---"
          cat release-notes.md

      # --- build --------------------------------------------------------------

      - name: Bundle
        env:
          DECKYEMU_BUILD: ${{ steps.commit.outputs.sha }}
        run: pnpm exec rollup -c

      # The bundle is what actually ships, so a silently empty one is worth
      # catching here rather than after a deploy.
      - name: Check the bundle is not empty
        run: test -s dist/index.js

      # The same guarantee again, against the bytes that actually ship. The step
      # above proves the mechanism works; it cannot prove anything about this
      # bundle, because it builds its own with a placeholder stamp. This one is
      # the artifact going into the zip.
      #
      # Development-only code must be absent from a release, not merely
      # unreachable in it -- the Reset panel deletes save games. This was
      # already false once: the build stamp used to be prepended after
      # tree-shaking, so the panel could never be folded away and shipped
      # intact. Checked against the bundle itself rather than trusted.
      #
      # What counts as development-only is read from check_release_build.py
      # rather than written out again here: two copies of the list is one that
      # gets a new entry and one that does not, and the one that does not is
      # this one -- the only check that sees the published bytes.
      - name: Check no development-only code shipped
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "scripts")
          from check_release_build import FORBIDDEN
          bundle = pathlib.Path("dist/index.js").read_text(encoding="utf-8", errors="replace")
          found = [needle for needle in FORBIDDEN if needle in bundle]
          for needle in found:
              print("::error::Release bundle contains development-only code: %s" % needle)
          if found:
              sys.exit(1)
          print("No development-only code in the bundle (%d checked)." % len(FORBIDDEN))
          PY

      # Only what the plugin needs at runtime, nested under the directory name
      # decky expects -- DECKY_PLUGIN_SETTINGS_DIR and friends derive from the
      # folder name, not from plugin.json, so unpacking under any other name
      # orphans existing settings.
      # Built here rather than committed, for the reason `dist/` is not
      # committed: it is output. Ubuntu 22.04 on purpose -- the shim has to load
      # inside a flatpak runtime, and a binary built against a newer glibc than
      # the runtime provides fails there with nothing but a loader warning.
      # Everything it calls is ancient libc, so an old toolchain costs nothing.
      - name: Build the shadPS4 motion shim
        run: |
          sudo apt-get install -y --no-install-recommends gcc >/dev/null
          mkdir -p bin
          gcc -shared -fPIC -O2 -Wall -Wextra -o bin/gyroshim.so shim/gyroshim.c -ldl
          test -s bin/gyroshim.so
          # That it exists proves nothing. The shim works by *shadowing* three
          # SDL entry points, so a misspelled one still compiles, still ships,
          # still loads, and silently intercepts nothing -- shadPS4 then starts
          # with motion switched on and its axes unrotated, which is tilt
          # working, turning doing nothing, and no error anywhere. Assert the
          # symbols it exists to export.
          for symbol in SDL_WaitEvent SDL_PollEvent SDL_WaitEventTimeout; do
            nm -D --defined-only bin/gyroshim.so | grep -qw "$symbol" || {
              echo "the shim does not export $symbol -- it would load and do nothing"
              exit 1
            }
          done

      - name: Assemble the plugin
        run: |
          mkdir -p artifact/deckyemu
          cp -r main.py plugin.json package.json py_modules dist bin artifact/deckyemu/
          # The compile is asserted above; this asserts it was *packaged*. A
          # shim that does not ship is not a failure anybody sees: `resolved_env`
          # drops an LD_PRELOAD whose file is missing, so shadPS4 starts with
          # motion switched on and its axes unrotated -- tilting works, turning
          # does nothing, and nothing anywhere says why.
          test -s artifact/deckyemu/bin/gyroshim.so
          find artifact -name '__pycache__' -type d -prune -exec rm -rf {} +
          find artifact -name '*.pyc' -delete
          # The backend half of the stamp. It must agree with what was compiled
          # into the bundle above, which is why both come from this one job.
          #
          # Written by python rather than a heredoc: `notes` is multi-line
          # markdown and has to be escaped into JSON properly. A heredoc would
          # produce a file that parses only until someone writes a quote in a
          # commit subject.
          VERSION="${{ steps.meta.outputs.version }}" \
          COMMIT="${{ steps.commit.outputs.sha }}" \
          RUN="${{ github.run_number }}" \
          python - <<'PY'
          import datetime, json, os, pathlib
          notes = pathlib.Path("release-notes.md")
          json.dump(
              {
                  "version": os.environ["VERSION"],
                  "commit": os.environ["COMMIT"],
                  "built_at": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "run": os.environ["RUN"],
                  "notes": notes.read_text(encoding="utf-8").strip() if notes.exists() else "",
              },
              open("artifact/deckyemu/build.json", "w", encoding="utf-8"),
              indent=2,
          )
          PY

      # The sourcemap is around 60% of the download and nothing a user can reach
      # will ever read it. Reading one means enabling remote CEF debugging,
      # restarting Steam, and attaching a browser from a second machine on the
      # network -- Desktop Mode, a keyboard and another device, which is the
      # exact combination this plugin exists to do without. Anybody in a
      # position to do it built the bundle and already has the map beside it.
      #
      # What a user actually has instead is Updates -> Report a problem, which
      # is why that feature exists: frontend errors reach the backend log
      # through `log_frontend_error` and travel in a redacted report.
      #
      # Dropped from the *release* only. `scripts/deploy.sh` still sends the
      # whole of dist/ to the Deck, where the map does help while debugging on
      # the device -- these are deliberately two paths, and the map is worth
      # its size on exactly one of them.
      - name: Drop the sourcemap from the release
        run: |
          python - <<'PY'
          import pathlib, sys

          dist = pathlib.Path("artifact/deckyemu/dist")
          bundle, sourcemap = dist / "index.js", dist / "index.js.map"

          # Asserted before removing, so this step fails loudly if rollup ever
          # stops emitting a map rather than quietly becoming a no-op that
          # everyone goes on believing in.
          if not sourcemap.is_file() or not sourcemap.stat().st_size:
              sys.exit("::error::No sourcemap to drop -- has the build changed?")
          dropped = sourcemap.stat().st_size
          sourcemap.unlink()

          # The comment has to go with it, or devtools asks for a file that is
          # no longer there. Matched on the whole trailing line rather than the
          # bare filename: the point is to leave no reference at all.
          text = bundle.read_text(encoding="utf-8")
          if "sourceMappingURL" not in text:
              sys.exit("::error::Bundle carries no sourcemap reference to strip.")
          stripped = "\n".join(
              line for line in text.splitlines() if "sourceMappingURL" not in line
          ) + "\n"
          if "sourceMappingURL" in stripped:
              sys.exit("::error::A sourcemap reference survived stripping.")
          bundle.write_text(stripped, encoding="utf-8", newline="\n")

          # The bundle still has to be the bundle. Stripping a trailing comment
          # should cost a line and nothing else, and a check that only proves
          # the reference is gone would pass just as well on an empty file.
          if not bundle.stat().st_size:
              sys.exit("::error::Stripping emptied the bundle.")
          if len(stripped.splitlines()) != len(text.splitlines()) - 1:
              sys.exit("::error::Stripping removed more than the one line.")
          print("Dropped %d KB of sourcemap from the release." % (dropped // 1024))
          PY

      # Fails the build rather than shipping halves that disagree, which is the
      # confusing state this stamping exists to make visible.
      #
      # Reads `artifact/` for the frontend half rather than `dist/`, because the
      # step above rewrites the bundle on its way into the artifact and the only
      # copy worth asserting on is the one that ships.
      #
      # Asserted on `FRONTEND_BUILD`, the constant the bundle actually exports,
      # rather than on the `__DECKYEMU_BUILD__` placeholder it is built from.
      # The placeholder is substituted before rollup parses -- that is what lets
      # the development-only panel be tree-shaken out of a release -- so it does
      # not survive into the output, and grepping for it failed the first build
      # after that change. This check runs only on request, so nothing noticed
      # for a day.
      - name: Check both halves carry the same stamp
        run: |
          grep -q "FRONTEND_BUILD = \"${{ steps.commit.outputs.sha }}\"" artifact/deckyemu/dist/index.js
          grep -q "${{ steps.commit.outputs.sha }}" artifact/deckyemu/build.json

      - uses: actions/upload-artifact@v7
        with:
          name: deckyemu-${{ steps.meta.outputs.version }}-${{ steps.commit.outputs.sha }}
          path: artifact/
          if-no-files-found: error

      # --- publish ------------------------------------------------------------
      #
      # The plugin's updater reads GitHub releases, so a release is what makes an
      # update reachable. The zip keeps deckyemu/ at its root for the same reason
      # the artifact does.

      - name: Package
        if: inputs.publish
        run: |
          cd artifact && zip -qr ../deckyemu.zip deckyemu && cd ..
          # The changelog first, then the machine trailer. `sha256:` is not
          # decoration -- releases.py scans the body for it and stage_update
          # verifies the download against it, so it has to survive whatever the
          # notes above happen to say. The plugin strips this trailer back off
          # before showing the notes to anyone.
          {
            cat release-notes.md
            echo ""
            echo ""
            echo "sha256: $(sha256sum deckyemu.zip | cut -d' ' -f1)"
            echo ""
            echo "Built from ${{ steps.commit.outputs.sha }}."
          } > notes.md

      - name: Publish the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.meta.outputs.version }}" deckyemu.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.commit.outputs.sha }}" \
            --title "v${{ steps.meta.outputs.version }}" \
            --notes-file notes.md
