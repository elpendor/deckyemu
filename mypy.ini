# Type checking for the backend.
#
# Deliberately not strict. The value is not exhaustive annotation -- it is the
# class of mistake a checker finds and tests do not. `prepare_shortcut` indexed
# `self._install` on a path where the guard above it allows None, so adding a
# game to a Deck with no RetroArch raised TypeError at the last statement
# before success. Every test had RetroArch installed, so nothing caught it.
#
# It also keeps the mixins honest: each declares what it uses from the composed
# Plugin (see plugin_base.py), so a helper renamed on one side fails here rather
# than on a Deck.
#
# `ignore_missing_imports` because `decky` only exists inside the plugin host --
# nothing to install, and no stub worth writing for four constants and a logger.
[mypy]
python_version = 3.11
ignore_missing_imports = True

# Both left off after measuring what they cost.
#
# `check_untyped_defs` adds fifty findings, and they are almost entirely mypy
# inferring `object` for the values of nested dict literals -- emulator_catalog
# is a large one, so `entry["source"]["id"]` reads as indexing an object.
# Clearing them means typing the catalog, which is a lot of work to restate what
# the file already shows plainly.
#
# `disallow_untyped_defs` would demand return types on 141 functions whose
# returns are dict-shaped. Those shapes are already declared in src/backend and
# enforced by TypeScript on the side that consumes them; a TypedDict per
# endpoint would be a second copy to keep in step, and the last thing this
# project needs is another rule written down twice.
check_untyped_defs = False
disallow_untyped_defs = False
